<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nạp tiền — Lumina AI</title>
  <link rel="icon" type="image/png" href="/src/assets/logo.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="app-shell">
  <header class="topbar" id="topbar"></header>

  <main class="home-main page-main">
    <section class="page-head">
      <h1 class="page-title">NẠP <span class="lp-highlight">TIỀN</span></h1>
      <p class="lp-sub">Nạp nhanh – cộng tự động 24/7. Chọn mệnh giá bên dưới.</p>
    </section>

    <section class="balance-card">
      <span class="balance-label">SỐ DƯ HIỆN TẠI</span>
      <strong class="balance-value" id="balance-value">0 ₫</strong>
    </section>

    <section class="page-section">
      <h2 class="page-subtitle">Chọn mệnh giá</h2>
      <div class="amount-grid" id="amount-grid"></div>
    </section>

    <section class="page-section">
      <h2 class="page-subtitle">Phương thức thanh toán</h2>
      <div class="pay-grid">
        <button type="button" class="pay-card is-active" data-pay="bank">
          <span class="pay-name">Chuyển khoản</span>
          <span class="pay-note">Vietcombank · MB Bank</span>
        </button>
        <button type="button" class="pay-card" data-pay="momo">
          <span class="pay-name">Ví MoMo</span>
          <span class="pay-note">Quét QR tức thì</span>
        </button>
        <button type="button" class="pay-card" data-pay="card">
          <span class="pay-name">Thẻ cào</span>
          <span class="pay-note">Viettel · Vina · Mobi</span>
        </button>
      </div>
    </section>

    <button type="button" class="lp-btn lp-btn-yellow page-submit" id="btn-deposit">
      Nạp tiền ngay →
    </button>
  </main>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng chính"></nav>

  <div class="toast" id="toast" role="status">
    <span class="toast-icon">
      <svg class="ic-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <svg class="ic-warn" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </span>
    <span id="toast-msg"></span>
  </div>

  <script type="module" src="/src/deposit.js"></script>
</body>
</html>
